name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (standard library only, no install needed)
        run: python -m unittest discover -p "test*.py" -v
      - name: Demo reproduces the README numbers
        run: python demo.py
      - name: Quick run of the rigor experiments
        run: python rigor.py --quick
