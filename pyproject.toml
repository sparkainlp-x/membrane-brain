[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-brain"
version = "0.1.0"
description = "A brain-shaped toy for a holographic-membrane associative memory with a refusal gate. Synthetic, stdlib-only; not a brain."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Jean-François Brisson"}]
keywords = ["toy-model", "associative-memory", "synthetic", "reproducible"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[tool.setuptools]
py-modules = ["brain", "rigor", "render_results"]
